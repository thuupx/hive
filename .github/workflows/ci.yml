name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # CGO stays enabled so the build matches the release configuration.
      # M0 has no cgo dependencies yet; the full OS x arch matrix required
      # by libSQL lands in M1 (see hive-v1-implementation-plan.md).
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: go version
        run: go version

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -o bin/hive ./cmd/hive
