name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # go-libsql ships prebuilt native libraries for linux and darwin on
        # amd64 and arm64 only, and CGO cannot be cross-compiled
        # practically, so each target is built on its own runner.
        # darwin/amd64 is not covered: GitHub retired the amd64 macOS
        # runner. See docs/adr/0001-storage-libsql.md.
        include:
          - os: ubuntu-latest # linux/amd64
          - os: ubuntu-24.04-arm # linux/arm64; needs GitHub arm64 hosted runners
          - os: macos-latest # darwin/arm64
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: go version
        run: go version

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -o bin/hive ./cmd/hive
